# 忘忧农场 - Docker Compose 配置
# 
# 使用方法：
# 1. 复制 ../server/.env.example 为 ../server/.env 并配置
# 2. docker-compose up -d
# 3. 访问 http://localhost:3000

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-farm123456}
      MYSQL_DATABASE: farm_game
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farm-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-farm123456}
      - DB_NAME=farm_game
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_change_me}
      - PORT=3000
    depends_on:
      - mysql

volumes:
  mysql_data:
